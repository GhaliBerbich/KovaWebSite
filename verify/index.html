<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOVA - Email Verified</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Arimo:ital,wght@1,700&family=Andika+New+Basic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f1fff5; 
            font-family: 'Arimo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            color: #000;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* Logo - Goes back one folder to find it */
        .logo {
            height: 40px; 
            width: auto;
            margin-bottom: 40px;
            object-fit: contain;
        }

        h1 {
            font-family: 'Andika New Basic', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #49b166;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        p {
            font-family: 'Arimo', sans-serif;
            font-size: 18px;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .bold-text {
            font-weight: 700;
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="../Kova_logo_white_1.svg" alt="KOVA" class="logo">

        <h1>EMAIL VERIFIED</h1>

        <p>You have successfully created your KOVA account.</p>
        <p class="bold-text">Please return to the app to continue.</p>

    </div>

</body>
</html>
