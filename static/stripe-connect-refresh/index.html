<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>KOVA - Session Expired</title>
    <link rel="icon" type="image/svg+xml" href="/Kova_Square_logo_photopea.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4fff7;
            --card-bg: #ffffff;
            --card-border: #d9f5e2;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --cta-green: #2CB252;
            --primary-accent: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arimo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(22, 101, 52, 0.04);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .logo-area img {
            height: 36px;
            width: auto;
        }

        .status-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
        }

        p.description {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .spinner-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 48px;
            margin: 8px 0;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--cta-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fallback-actions {
            display: none;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--cta-green);
            color: #ffffff;
            border: none;
        }

        .btn-primary:active {
            background-color: var(--primary-accent);
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--cta-green);
            border: 1.5px solid var(--card-border);
        }

        .btn-secondary:active {
            background-color: var(--bg-main);
        }

        .support-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
                border-top-color: #e5e7eb;
                position: relative;
            }

            .spinner::after {
                content: "Loading...";
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 12px;
                color: var(--text-muted);
            }

            .fallback-actions {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo-area">
            <svg width="100" height="36" viewBox="0 0 100 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="50" y="26" font-family="'Arimo', sans-serif" font-size="28" font-weight="800" fill="#111827"
                    text-anchor="middle" letter-spacing="-0.5">KOVA</text>
            </svg>
        </div>

        <div class="status-content">
            <h1>Session Expired</h1>
            <p class="description">Your onboarding session expired. Reopening Kova to continue…</p>
        </div>

        <div class="spinner-container" id="spinnerContainer">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>

        <div class="fallback-actions" id="fallbackActions">
            <p class="support-text">If nothing happens, use the button below.</p>
            <button class="btn btn-primary" onclick="attemptDeepLink()" aria-label="Open Kova app">Open Kova
                app</button>
        </div>
    </div>

    <script>
        const deepLinkUrl = 'com.kovagroup.kova://stripe-connect-refresh';

        function attemptDeepLink() {
            window.location.replace(deepLinkUrl);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Attempt to deep link immediately
            attemptDeepLink();

            // Set timeout to show fallback UI if app doesn't open
            setTimeout(() => {
                document.getElementById('spinnerContainer').style.display = 'none';
                document.getElementById('fallbackActions').style.display = 'flex';
            }, 1200);

            // Handle visibility change (if user comes back to browser)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    document.getElementById('spinnerContainer').style.display = 'none';
                    document.getElementById('fallbackActions').style.display = 'flex';
                }
            });
        });
    </script>
</body>

</html>
