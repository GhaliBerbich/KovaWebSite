<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifesto — KOVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0c0c; color: #fff; font-family: 'Inter', sans-serif; }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 28px;
      background: rgba(12,12,12,0.80);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-logo { height: 28px; width: auto; cursor: pointer; }
    .nav-back {
      font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.55);
      text-decoration: none; letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    .nav-back:hover { color: #fff; }

    main {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html">
      <img class="nav-logo" src="KOVA logo.png" alt="KOVA" decoding="async" />
    </a>
    <a href="index.html" class="nav-back">← Back</a>
  </nav>

  <main>
    <!-- content coming soon -->
  </main>

</body>
</html>
