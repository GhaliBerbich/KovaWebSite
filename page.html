<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOVA - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        .signup-container {
            background: white;
            border-radius: 24.427px;
            padding: 26.056px;
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .signup-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }
        .signup-title {
            font-size: 36px;
            font-weight: 700;
            color: #000;
            text-align: center;
            width: 100%;
        }
        .signup-instructions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .signup-instructions p {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            text-align: center;
            line-height: 1.6;
        }
        .email-input-container {
            width: 100%;
            max-width: 540px;
            position: relative;
        }
        .email-input {
            width: 100%;
            height: 52px;
            border: none;
            border-bottom: 2px solid #000;
            font-size: 16px;
            font-weight: 700;
            padding: 0 20px;
            padding-right: 50px;
            background: transparent;
            outline: none;
            color: #000;
        }
        .email-input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 0, 0, 0.5);
            transition: color 0.2s ease;
            width: 32px;
            height: 32px;
        }
        .password-toggle:hover {
            color: #000;
        }
        .password-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #49b166;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: background 0.3s ease;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .back-button:hover {
            background: #3a8f52;
        }
        .signup-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .signup-terms {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #000;
            line-height: 1.8;
            padding: 0 16px;
        }
        .signup-terms a {
            color: #49b166;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <button class="back-button" onclick="window.history.back()">← Back</button>
        <div class="signup-header">
            <h1 class="signup-title">Verify your school</h1>
            <div class="signup-instructions">
                <p>Enter your email</p>
                <div class="email-input-container">
                    <input type="email" id="emailInput" class="email-input" placeholder="email" />
                </div>
                <p style="margin-top: 12px;">Create a password</p>
                <div class="email-input-container">
                    <input type="password" id="passwordInput" class="email-input" placeholder="password" />
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <svg id="eyeOffIcon" viewBox="0 0 24 24" style="display: block;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                        <svg id="eyeIcon" viewBox="0 0 24 24" style="display: none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="signup-footer">
            <div class="signup-terms">
                By continuing, you agree to our <a href="#" onclick="alert('Terms of service'); return false;">terms of service</a> and <a href="#" onclick="alert('Privacy policy'); return false;">privacy policy</a>.
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        if (toggleBtn && passwordInput && eyeIcon && eyeOffIcon) {
            toggleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                eyeIcon.style.display = isHidden ? 'block' : 'none';
                eyeOffIcon.style.display = isHidden ? 'none' : 'block';
            });
        }
    </script>
</body>
</html>
