<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOVA - Email Verified</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Arimo:ital,wght@1,700&family=Andika+New+Basic:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f1fff5; 
            font-family: 'Arimo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            color: #000;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* Logo - Goes back one folder to find it */
        .logo {
            height: 40px; 
            width: auto;
            margin-bottom: 40px;
            object-fit: contain;
        }

        h1 {
            font-family: 'Andika New Basic', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #49b166;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        p {
            font-family: 'Arimo', sans-serif;
            font-size: 18px;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .bold-text {
            font-weight: 700;
        }

        .hidden { display: none; }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="../Kova_logo_white_1.svg" alt="KOVA" class="logo">
        <div id="loading-view">
            <h1>VERIFYING...</h1>
            <p>Please wait while we verify your email.</ßßßp>
        </div>

        <div id="success-view" class="hidden">
            <h1>EMAIL VERIFIED</h1>
            <p>You have successfully created your KOVA account.</p>
            <p class="bold-text">Please return to the app to continue.</p>
        </div>

        <div id="error-view" class="hidden">
            <h1 style="color: #000;">LINK EXPIRED</h1>
            <p>This link is invalid or has already been used.</p>
        </div>

    </div>

    <script>
        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDq9-TdWwlutxrFhXgUDwafJNFizMjZ-1Y",
            authDomain: "kova-ad7c9.firebaseapp.com",
            projectId: "kova-ad7c9",
            storageBucket: "kova-ad7c9.firebasestorage.app",
            messagingSenderId: "498395930882",
            appId: "1:498395930882:web:2d2a6ab51d081fd95fe21b",
            measurementId: "G-GZWP3GZZF0"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // 2. VERIFICATION LOGIC
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const actionCode = urlParams.get('oobCode');

            if (!actionCode) {
                // For visual testing only. 
                // Once deployed, users without a code will see this unless you change it to 'error-view'
                showView('success-view'); 
                return;
            }

            auth.applyActionCode(actionCode)
                .then(() => {
                    showView('success-view');
                })
                .catch((error) => {
                    console.error(error);
                    showView('error-view');
                });
        });

        function showView(viewId) {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('error-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</body>
</html>
