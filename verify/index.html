<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOVA - Email Verification</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Andika+New+Basic:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f1fff5; 
            font-family: 'Arimo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            color: #000;
        }
        .container { max-width: 600px; width: 100%; }
        .logo { height: 40px; width: auto; margin-bottom: 40px; object-fit: contain; }
        h1 { font-family: 'Andika New Basic', sans-serif; font-size: 40px; font-weight: 700; color: #49b166; margin-bottom: 24px; line-height: 1.1; }
        p { font-family: 'Arimo', sans-serif; font-size: 18px; color: #000000; line-height: 1.5; margin-bottom: 8px; }
        .bold-text { font-weight: 700; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <img src="../Kova_logo_white_1.svg" alt="KOVA" class="logo">

        <div id="loading-view">
            <h1>VERIFYING...</h1>
            <p>Please wait while we sync your account.</p>
        </div>

        <div id="success-view" class="hidden">
            <h1>EMAIL VERIFIED</h1>
            <p>You have successfully verified your KOVA account.</p>
            <p class="bold-text">Please return to the app to continue.</p>
        </div>

        <div id="error-view" class="hidden">
            <h1 style="color: #000;">LINK EXPIRED</h1>
            <p id="error-message">This link is invalid or has already been used.</p>
            <p class="bold-text">Please request a new link from the app.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDq9-TdWwlutxrFhXgUDwafJNFizMjZ-1Y",
            authDomain: "REMOVED_AUTH_DOMAIN",
            projectId: "REMOVED_PROJECT_ID",
            storageBucket: "REMOVED_PROJECT_ID.firebasestorage.app",
            messagingSenderId: "REMOVED_SENDER_ID",
            appId: "1:REMOVED_SENDER_ID:web:2d2a6ab51d081fd95fe21b",
            measurementId: "REMOVED_MEASUREMENT_ID"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();

        function showView(viewId) {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('error-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const actionCode = urlParams.get('oobCode');

            if (!actionCode) {
                showView('error-view');
                return;
            }

            // Attempt verification automatically
            auth.applyActionCode(actionCode)
                .then(() => {
                    // Fresh link, verification successful
                    showView('success-view');
                })
                .catch((error) => {
                    console.error("Firebase Error Code:", error.code);
                    
                    if (error.code === 'auth/invalid-action-code') {
                        /** * CASE: Bot already clicked the link.
                         * The code is "invalid" because it was used 5 minutes ago by the scanner.
                         * We show SUCCESS because the account IS verified.
                         */
                        showView('success-view');
                    } 
                    else if (error.code === 'auth/expired-action-code') {
                        /** * CASE: Real Expiry.
                         * The link is genuinely too old (sent a long time ago).
                         */
                        document.getElementById('error-message').innerText = "This link has expired.";
                        showView('error-view');
                    }
                    else {
                        /**
                         * CASE: Other errors (malformed link, network error, etc.)
                         */
                        showView('error-view');
                    }
                });
        };
    </script>
</body>
</html>
